# Builds the app and deploys it to Cloudflare (Worker "blackout", static assets from app/dist)
# on every push to main. Vercel deploys the same commit to blackout.anshverma.tech in parallel.
# Needs two repo secrets: CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers") and
# CLOUDFLARE_ACCOUNT_ID. Without them the job skips the deploy instead of failing.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# the job only reads the repo; deploying uses the Cloudflare token, not GitHub's
permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        run: npm run build
        # Mainnet switch: set repository variables VITE_CLUSTER=mainnet and VITE_PROGRAM_ID, and the
        # secret VITE_BASE_RPC (a domain-restricted mainnet RPC; it ships inside the site). Unset = devnet.
        env:
          VITE_CLUSTER: ${{ vars.VITE_CLUSTER }}
          VITE_PROGRAM_ID: ${{ vars.VITE_PROGRAM_ID }}
          VITE_BASE_RPC: ${{ secrets.VITE_BASE_RPC }}

      - name: Deploy
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.158.0"
          command: deploy

      - name: No Cloudflare token yet
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set; built but did not deploy."
