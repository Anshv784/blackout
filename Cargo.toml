[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
# Smallest binary = smallest rent. Overflow panics stay off: money maths is checked by hand,
# and a stray panic mid-tick would freeze a live room.
opt-level = "z"
strip = true
overflow-checks = false
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
