[package]
name = "blackout"
version = "0.1.0"
description = "Blackout: real-time fog-of-war battle royale on MagicBlock Private Ephemeral Rollups"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "blackout"

[features]
default = ["custom-panic", "no-log-ix-name"]
mainnet = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.0.2"
ephemeral-rollups-sdk = { version = "0.17.3", features = ["anchor", "access-control", "crank", "vrf"] }
bytemuck = { version = "1.16", features = ["derive", "min_const_generics"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
